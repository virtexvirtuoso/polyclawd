<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/polyclawd.css?v=1">
<title>Whale Shark Pipeline — Polyclawd</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --abyss:#0a0a0f; --panel:#0e0f16; --border:#1d2030;
  --text:#e7eaf2; --dim:#8d93a8; --faint:#4d5268;
  --crit:#ff3b52; --high:#f0a050; --low:#4ecdc4; --gold:#ffd700; --blue:#4ea1e0;
}
*{margin:0;padding:0;box-sizing:border-box}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(160,180,220,.022) 0 1px,transparent 1px 4px)}
::selection{background:var(--crit);color:#fff}
h1 em{font-style:normal;color:var(--crit)}
body{background:var(--abyss);color:var(--text);font-family:'IBM Plex Mono',ui-monospace,monospace;
  min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(100% 50% at 50% -10%, rgba(45,140,212,.08), transparent 60%)}
header{display:flex;align-items:center;gap:16px;padding:16px 26px}
h1{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;font-size:22px;letter-spacing:.04em}
h1 span{color:var(--low)}
header .sub{color:var(--faint);font-size:11px;letter-spacing:.1em}
.nav{margin-left:auto;display:flex;gap:14px}
.nav a{color:var(--faint);text-decoration:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.nav a:hover{color:var(--low)}
.wrap{flex:1;padding:0 26px 26px;display:flex;justify-content:center}
svg{width:100%;max-width:1280px;height:auto}

/* node boxes */
.node rect{fill:var(--panel);stroke:var(--border);stroke-width:1;rx:10}
.node.src rect{stroke:#1d4f7a}
.node.score rect{stroke:#5a3d8f}
.node.db rect{stroke:#8f6a2a}
.node.out rect{stroke:#1f6e5d}
.node .h{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:13px;font-weight:600;fill:var(--text);letter-spacing:.04em}
.node .d{font-size:9.5px;fill:var(--dim)}
.node .tag{font-size:8.5px;fill:var(--faint);letter-spacing:.12em}

/* flowing edges */
.edge{fill:none;stroke-width:1.6;stroke-dasharray:6 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.e-blue{stroke:rgba(78,161,224,.7)} .e-teal{stroke:rgba(78,205,196,.7)}
.e-gold{stroke:rgba(255,215,0,.75)} .e-crit{stroke:rgba(255,59,82,.8)}
.e-dim{stroke:rgba(122,138,165,.45);animation-duration:2.2s}
.lbl{font-size:9px;fill:var(--faint);letter-spacing:.06em}
.lbl.hot{fill:#ff7585}

/* gate diamonds */
.gate path{fill:#11131c;stroke:#2a4a7a;stroke-width:1}
.gate text{font-size:8.5px;fill:var(--dim)}

.legend{font-size:9.5px;fill:var(--faint)}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
footer{padding:0 26px 18px;color:var(--faint);font-size:10px;letter-spacing:.06em}
footer b{color:var(--dim)}

  :root{
    --abyss:var(--pc-bg); --panel:var(--pc-panel); --border:var(--pc-line);
    --text:var(--pc-ink); --dim:var(--pc-dim); --faint:var(--pc-faint);
    --crit:var(--pc-crit); --high:var(--pc-warn); --low:var(--pc-chart-4); --gold:var(--pc-gold); --blue:var(--pc-chart-4);
  }
  /* ── Probability Bureau adoption (css/polyclawd.css) ── */
  body{font-family:var(--pc-mono);background:var(--pc-bg);color:var(--pc-ink)}
  body > *{position:relative;z-index:1}
  *{border-radius:0!important;box-shadow:none!important;text-shadow:none!important;filter:none!important}
  h1,h2,h3,h4,.stat-value,.card-value,.page-title,.kpi-value,.big-num{font-family:var(--pc-disp);font-weight:400;letter-spacing:.03em}
</style>
</head>
