<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Polyclawd">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Polyclawd — Paper Desk</title>
  <!-- Probability Bureau design system: virtuoso.css first, polyclawd.css
       retokenizes it via the legacy bridge (see css/polyclawd.css header) -->
  <link rel="stylesheet" href="css/virtuoso.css?v=5">
  <link rel="stylesheet" href="css/polyclawd.css?v=1">
</head>
<body data-pc-section="Paper desk">

  <main class="main-content">
    <div class="container">

      <div class="pc-rule" style="margin-top:20px">
        <span class="idx">01 /</span> <h1 style="font-size:inherit;font-weight:inherit;font-family:inherit;letter-spacing:inherit;display:inline">Polymarket paper desk</h1>
        <small>real market data · synthetic fills</small>
        <button class="pc-btn" onclick="loadDashboard()" style="margin-left:14px">↻ refresh</button>
      </div>

      <!-- Stats Grid (populated by js/app.js) -->
      <div id="stats-grid" class="stats-grid">
        <div class="loading">
          <div class="spinner"></div>
          <span>Loading portfolio data…</span>
        </div>
      </div>

      <!-- Open Positions -->
      <section class="section">
        <div class="pc-rule"><span class="idx">02 /</span> Open positions</div>
        <!-- Desktop table -->
        <div id="positions-table" class="table-container">
          <div class="loading">
            <div class="spinner"></div>
            <span>Loading positions…</span>
          </div>
        </div>
        <!-- Mobile cards -->
        <div id="positions-cards" class="position-cards">
          <div class="loading">
            <div class="spinner"></div>
            <span>Loading…</span>
          </div>
        </div>
      </section>

      <!-- Recent Trades -->
      <section class="section">
        <div class="pc-rule"><span class="idx">03 /</span> Recent trades</div>
        <div class="card">
          <div id="recent-trades">
            <div class="loading">
              <div class="spinner"></div>
              <span>Loading recent trades…</span>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js?v=4"></script>
  <script src="polyclawd-shell.js" defer></script>
  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered'))
        .catch((err) => console.log('SW error:', err));
    }

    // Pull to refresh (mobile)
    let touchStart = 0;
    let touchY = 0;
    const pullIndicator = document.createElement('div');
    pullIndicator.className = 'pull-indicator';
    pullIndicator.textContent = '↓ Pull to refresh';
    document.body.appendChild(pullIndicator);

    document.addEventListener('touchstart', (e) => {
      touchStart = e.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (window.scrollY === 0) {
        touchY = e.touches[0].clientY - touchStart;
        if (touchY > 50) {
          pullIndicator.classList.add('visible');
          pullIndicator.textContent = touchY > 100 ? '↑ Release to refresh' : '↓ Pull to refresh';
        }
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      if (touchY > 100 && window.scrollY === 0) {
        pullIndicator.textContent = '⟳ Refreshing…';
        setTimeout(() => {
          loadDashboard();
          pullIndicator.classList.remove('visible');
        }, 500);
      } else {
        pullIndicator.classList.remove('visible');
      }
      touchY = 0;
    });
  </script>
</body>
</html>
