[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
pythonpath = .

# A module-not-found in ONE test file used to abort the ENTIRE session
# ("Interrupted: N errors during collection"), so `pytest tests/` reported
# nothing at all. Three files import modules that no longer exist
# (signals.election_polls, signals.cross_platform_elections, paper_portfolio
# .SOFT_CAP). Reporting them as errors while still running everything else is
# strictly more informative than refusing to run. Remove this line once those
# orphan tests are deleted or their modules restored.
addopts = --continue-on-collection-errors
